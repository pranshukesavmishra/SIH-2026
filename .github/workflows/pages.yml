# Publish the showcase site: uploads docs/ to GitHub Pages.
#
# MANUAL ONLY -- run it from the Actions tab ("Run workflow"). The
# comment here used to say "every push to main redeploys", which was
# never true: the only trigger is workflow_dispatch. Anyone reading the
# comment would have assumed their merged work was live when it was not.
#
# Deliberately left manual rather than fixed to match the comment,
# because turning it on publishes the site on every push and that is
# the team's call, not a tidy-up. To make it automatic, add:
#   push:
#     branches: [main]
name: deploy-site
on:
  workflow_dispatch:

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deployment
        uses: actions/deploy-pages@v4

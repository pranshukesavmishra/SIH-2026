<text x="32" y="56" font-size="8" text-anchor="middle" fill="#9c2e23" font-family="monospace" font-weight="bold">OV7670 — NO</text>
<text x="32" y="63" font-size="7" text-anchor="middle" fill="#9c2e23" font-family="monospace">parallel, no USB</text></symbol>


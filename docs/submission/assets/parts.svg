<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- Line-art part icons for the buy list. Drawn rather than photographed:
     a drawing can exaggerate the one feature that distinguishes a correct
     part from a wrong one, which a catalogue photo cannot. The magnet
     pair is the whole reason this file exists. -->
<symbol id="p-nema" viewBox="0 0 64 64"><g fill="none" stroke="#123" stroke-width="2.6">
<rect x="10" y="12" width="40" height="40" rx="3"/><circle cx="30" cy="32" r="8"/>
<line x1="50" y1="32" x2="60" y2="32" stroke-width="5"/>
<circle cx="16" cy="18" r="1.8" fill="#123"/><circle cx="44" cy="18" r="1.8" fill="#123"/>
<circle cx="16" cy="46" r="1.8" fill="#123"/><circle cx="44" cy="46" r="1.8" fill="#123"/>
<line x1="10" y1="24" x2="4" y2="24"/><line x1="10" y1="30" x2="4" y2="30"/>
<line x1="10" y1="36" x2="4" y2="36"/><line x1="10" y1="42" x2="4" y2="42"/></g></symbol>

<symbol id="p-a4988" viewBox="0 0 64 64"><g fill="none" stroke="#123" stroke-width="2.4">
<rect x="14" y="8" width="36" height="48" rx="2"/>
<rect x="22" y="20" width="20" height="20" rx="1"/>
<circle cx="32" cy="50" r="5"/><line x1="32" y1="45" x2="32" y2="55"/>
<g stroke-width="2">
<line x1="14" y1="14" x2="8" y2="14"/><line x1="14" y1="22" x2="8" y2="22"/>
<line x1="14" y1="30" x2="8" y2="30"/><line x1="14" y1="38" x2="8" y2="38"/>
<line x1="50" y1="14" x2="56" y2="14"/><line x1="50" y1="22" x2="56" y2="22"/>
<line x1="50" y1="30" x2="56" y2="30"/><line x1="50" y1="38" x2="56" y2="38"/></g></g>
<text x="32" y="17" font-size="9" text-anchor="middle" fill="#123" font-family="monospace">VREF</text></symbol>

<symbol id="p-cap" viewBox="0 0 64 64"><g fill="none" stroke="#123" stroke-width="2.6">
<rect x="20" y="10" width="24" height="36" rx="3"/>
<path d="M24 10 v36" stroke-width="7" stroke-opacity=".28"/>
<line x1="27" y1="46" x2="27" y2="60"/><line x1="37" y1="46" x2="37" y2="60"/></g>
<text x="37" y="30" font-size="13" text-anchor="middle" fill="#123" font-family="monospace">+</text></symbol>

<symbol id="p-as5600" viewBox="0 0 64 64"><g fill="none" stroke="#123" stroke-width="2.4">
<rect x="10" y="14" width="44" height="34" rx="3"/><circle cx="34" cy="31" r="9"/>
<circle cx="34" cy="31" r="2.6" fill="#123" stroke="none"/>
<circle cx="16" cy="20" r="1.6" fill="#123" stroke="none"/>
<circle cx="16" cy="42" r="1.6" fill="#123" stroke="none"/>
<g stroke-width="2"><line x1="10" y1="26" x2="4" y2="26"/><line x1="10" y1="31" x2="4" y2="31"/>
<line x1="10" y1="36" x2="4" y2="36"/></g></g></symbol>

<!-- The two magnets side by side. This is the single most expensive
     confusion available in the build: they are the same cylinder and only
     the pole axis differs. -->
<symbol id="p-magnet" viewBox="0 0 64 64">
<g fill="none" stroke="#1a7a3c" stroke-width="2.6">
<ellipse cx="18" cy="16" rx="13" ry="5"/><path d="M5 16 v14"/><path d="M31 16 v14"/>
<ellipse cx="18" cy="30" rx="13" ry="5"/></g>
<line x1="18" y1="11" x2="18" y2="35" stroke="#1a7a3c" stroke-width="1.6" stroke-dasharray="3 2"/>
<text x="9" y="26" font-size="10" fill="#1a7a3c" font-family="monospace" font-weight="bold">N</text>
<text x="23" y="26" font-size="10" fill="#1a7a3c" font-family="monospace" font-weight="bold">S</text>
<text x="18" y="46" font-size="8.5" text-anchor="middle" fill="#1a7a3c" font-family="monospace" font-weight="bold">DIAMETRIC</text>
<text x="18" y="55" font-size="8.5" text-anchor="middle" fill="#1a7a3c" font-family="monospace">BUY THIS</text>
<g fill="none" stroke="#9c2e23" stroke-width="2.6">
<ellipse cx="48" cy="16" rx="13" ry="5"/><path d="M35 16 v14"/><path d="M61 16 v14"/>
<ellipse cx="48" cy="30" rx="13" ry="5"/></g>
<text x="48" y="15" font-size="9" text-anchor="middle" fill="#9c2e23" font-family="monospace" font-weight="bold">N</text>
<text x="48" y="36" font-size="9" text-anchor="middle" fill="#9c2e23" font-family="monospace" font-weight="bold">S</text>
<text x="48" y="46" font-size="8.5" text-anchor="middle" fill="#9c2e23" font-family="monospace" font-weight="bold">AXIAL</text>
<text x="48" y="55" font-size="8.5" text-anchor="middle" fill="#9c2e23" font-family="monospace">DEAD</text>
<line x1="36" y1="8" x2="60" y2="40" stroke="#9c2e23" stroke-width="2.4"/></symbol>

<symbol id="p-mux" viewBox="0 0 64 64"><g fill="none" stroke="#123" stroke-width="2.4">
<rect x="12" y="12" width="40" height="40" rx="3"/>
<rect x="24" y="24" width="16" height="16" rx="1"/>
<g stroke-width="2"><line x1="12" y1="20" x2="6" y2="20"/><line x1="12" y1="32" x2="6" y2="32"/>
<line x1="12" y1="44" x2="6" y2="44"/>
<line x1="52" y1="18" x2="58" y2="18"/><line x1="52" y1="26" x2="58" y2="26"/>
<line x1="52" y1="34" x2="58" y2="34"/><line x1="52" y1="42" x2="58" y2="42"/></g></g>
<text x="32" y="36" font-size="8" text-anchor="middle" fill="#123" font-family="monospace">1:8</text></symbol>

<!-- USB camera vs OV7670. Added after an OV7670 was nearly bought: it is
     a parallel DVP part with no USB, and no laptop can open it. -->
<symbol id="p-camera" viewBox="0 0 64 64">
<g fill="none" stroke="#1a7a3c" stroke-width="2.6">
<rect x="4" y="14" width="28" height="28" rx="2"/><circle cx="18" cy="28" r="9"/>
<circle cx="18" cy="28" r="4.5"/>
<path d="M32 28 h10 a4 4 0 0 1 4 4 v6"/>

<path d="M44 45 v6 M48 45 v6"/></g>
<text x="46" y="26" font-size="9" text-anchor="middle" fill="#1a7a3c" font-family="monospace" font-weight="bold">USB</text>
<text x="18" y="52" font-size="8" text-anchor="middle" fill="#1a7a3c" font-family="monospace" font-weight="bold">UVC WEBCAM</text>
<text x="18" y="60" font-size="7.5" text-anchor="middle" fill="#1a7a3c" font-family="monospace">M12 lens</text></symbol>

<symbol id="p-ov7670" viewBox="0 0 64 64">
<g fill="none" stroke="#9c2e23" stroke-width="2.6">
<rect x="14" y="12" width="36" height="34" rx="2"/><circle cx="32" cy="29" r="9"/>
<g stroke-width="1.8">

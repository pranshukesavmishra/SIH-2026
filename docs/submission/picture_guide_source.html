<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>ZeroDrift MK2 Picture Guide</title>
<style>
@page { size: 1080px 1350px; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; background: #E6ECF3; font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; color: #0F172A; }
.card { width: 1080px; height: 1350px; background: #fff; margin: 0 auto 40px; position: relative; overflow: hidden;
  display: flex; flex-direction: column; break-after: page; page-break-after: always; }
@media print { body { background: #fff; } .card { margin: 0; } }
.card header { display: flex; align-items: center; gap: 24px; padding: 36px 48px 20px; }
.num { flex: none; width: 96px; height: 96px; border-radius: 26px; background: #0891B2; color: #fff;
  font: 800 54px/96px "DejaVu Sans", sans-serif; text-align: center; box-shadow: 0 6px 16px rgba(8,145,178,.3); }
.num.p2 { background: #7C3AED; box-shadow: 0 6px 16px rgba(124,58,237,.3); }
.num.p3 { background: #EA580C; box-shadow: 0 6px 16px rgba(234,88,12,.3); }
.num.p4 { background: #16A34A; box-shadow: 0 6px 16px rgba(22,163,74,.3); }
.kicker { font: 700 20px "DejaVu Sans", sans-serif; letter-spacing: .14em; color: #0891B2; }
.kicker.p2 { color: #7C3AED; } .kicker.p3 { color: #EA580C; } .kicker.p4 { color: #16A34A; }
h2 { margin: 6px 0 0; font: 800 42px/1.12 "DejaVu Sans", sans-serif; letter-spacing: -.01em; }
.art { margin: 0 36px; border-radius: 26px; background: #F3F7FB; border: 2px solid #E2E8F0; height: 700px; overflow: hidden; }
.art svg { display: block; width: 1004px; height: 696px; }
ol.do { margin: 24px 48px 0; padding: 0; list-style: none; counter-reset: s; }
ol.do li { counter-increment: s; position: relative; padding-left: 60px; margin: 0 0 14px; font: 500 28px/1.32 "DejaVu Sans", sans-serif; }
ol.do li::before { content: counter(s); position: absolute; left: 0; top: -1px; width: 44px; height: 44px; border-radius: 50%;
  background: #E0F2FE; color: #0369A1; font: 800 24px/44px "DejaVu Sans", sans-serif; text-align: center; }
ol.do li b { color: #0F172A; }
.check { margin: auto 48px 0; padding: 18px 24px 18px 78px; border-radius: 20px; background: #DCFCE7; color: #14532D;
  font: 600 26px/1.3 "DejaVu Sans", sans-serif; position: relative; }
.check::before { content: "✓"; position: absolute; left: 22px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px;
  border-radius: 50%; background: #16A34A; color: #fff; font: 800 26px/42px "DejaVu Sans", sans-serif; text-align: center; }
.check.warn { background: #FEE2E2; color: #7F1D1D; }
.check.warn::before { content: "!"; background: #DC2626; }
footer { padding: 14px 48px 24px; font: 600 18px "DejaVu Sans", sans-serif; color: #94A3B8; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="cards"></div>
<script>
/* ======================================================================
   A tiny SVG drawing kit. Every card below is drawn from these pieces,
   so a motor, a screw or a magnet looks the same on every page.
   ====================================================================== */
const C = {
  ink: '#0F172A', mute: '#64748B', line: '#334155', faint: '#CBD5E1',
  acr: '#D3F0FB', acrS: '#3FA7CF', acrHi: '#FFFFFF',
  sheetW: '#F8FAFC', sheetWS: '#94A3B8',
  motor: '#23272E', motorD: '#0B0D10', cap: '#B9C1CB', capS: '#6B7280',
  shaft: '#C9CED6', shaftS: '#6B7280',
  red: '#DC2626', mag: '#E23B3B', magB: '#2563EB',
  sens: '#6D28D9', sensD: '#4C1D95', chip: '#111827',
  screw: '#A1A8B3', screwS: '#4B5563', nut: '#8B939E',
  putty: '#8E9170', puttyS: '#5A5C42', puttyHi: '#B7B995',
  wood: '#D6B287', woodS: '#9C7A52',
  green: '#16A34A', cyan: '#0891B2', amber: '#D97706', violet: '#7C3AED', orange: '#EA580C',
  brass: '#C9A227', brassS: '#8A6D12', board: '#1F7A4A', boardB: '#1E5AA8',
  w12: '#DC2626', w5: '#EA8A0C', wG: '#111827', wSDA: '#2563EB', wSCL: '#16A34A', wSig: '#7C3AED',
};
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const FONT = 'DejaVu Sans, Arial, sans-serif';

const DEFS = `<defs>
  ${['ink', 'red', 'green', 'cyan', 'amber', 'violet', 'mute', 'orange'].map(k => `
  <marker id="ah-${k}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="${C[k] || C.ink}"/></marker>`).join('')}
  <linearGradient id="gShV" x1="0" x2="1"><stop offset="0" stop-color="#EEF1F4"/><stop offset=".45" stop-color="#A9B0B9"/><stop offset="1" stop-color="#DDE1E6"/></linearGradient>
  <linearGradient id="gShH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF1F4"/><stop offset=".45" stop-color="#A9B0B9"/><stop offset="1" stop-color="#DDE1E6"/></linearGradient>
  <linearGradient id="gAcr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E7F8FE"/><stop offset="1" stop-color="#BFE7F7"/></linearGradient>
  <linearGradient id="gMot" x1="0" x2="1"><stop offset="0" stop-color="#15181C"/><stop offset=".5" stop-color="#2E333A"/><stop offset="1" stop-color="#15181C"/></linearGradient>
  <linearGradient id="gMotH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15181C"/><stop offset=".5" stop-color="#2E333A"/><stop offset="1" stop-color="#15181C"/></linearGradient>
  <linearGradient id="gWood" x1="0" x2="1"><stop offset="0" stop-color="#E2C39C"/><stop offset="1" stop-color="#C79E6E"/></linearGradient>
  <linearGradient id="gPutty" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A6A984"/><stop offset="1" stop-color="#7A7D5C"/></linearGradient>
  <pattern id="thr" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)"><rect width="5" height="5" fill="#B8BEC7"/><line x1="0" y1="0" x2="5" y2="0" stroke="#6B7280" stroke-width="1.6"/></pattern>
  <pattern id="thrH" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(70)"><rect width="5" height="5" fill="#B8BEC7"/><line x1="0" y1="0" x2="5" y2="0" stroke="#6B7280" stroke-width="1.6"/></pattern>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity=".16"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>`;
const svg = inner => `<svg viewBox="0 0 1004 696" xmlns="http://www.w3.org/2000/svg">${DEFS}${inner}</svg>`;

// --- primitives -----------------------------------------------------------
const R = (x, y, w, h, f, s = 'none', sw = 0, rx = 0, ex = '') =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" stroke="${s}" stroke-width="${sw}" ${ex}/>`;
const Ci = (x, y, r, f, s = 'none', sw = 0, ex = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${s}" stroke-width="${sw}" ${ex}/>`;
const Ln = (x1, y1, x2, y2, c = C.line, w = 2, ex = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${ex}/>`;
const P = (d, f = 'none', s = C.line, w = 2, ex = '') => `<path d="${d}" fill="${f}" stroke="${s}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${ex}/>`;
// Text; "\n" makes new lines. o: s size, w weight, c colour, a anchor, bg pill colour.
function T(x, y, t, o = {}) {
  const s = o.s || 22, w = o.w || 600, c = o.c || C.ink, a = o.a || 'start', lh = o.lh || 1.2;
  const lines = String(t).split('\n');
  let out = '';
  if (o.bg) {
    const tw = Math.max(...lines.map(l => l.length)) * s * 0.6 + 26, th = lines.length * s * lh + s * 0.5;
    const bx = a === 'middle' ? x - tw / 2 : a === 'end' ? x - tw + 13 : x - 13;
    out += R(bx, y - s * 1.02, tw, th, o.bg, o.bs || 'none', o.bs ? 2 : 0, Math.min(16, s * 0.55), o.shadow ? 'filter="url(#sh)"' : '');
  }
  out += `<text x="${x}" y="${y}" font-size="${s}" font-weight="${w}" fill="${c}" text-anchor="${a}" font-family="${FONT}">` +
    lines.map((l, i) => `<tspan x="${x}" dy="${i ? s * lh : 0}">${esc(l)}</tspan>`).join('') + `</text>`;
  return out;
}
const A = (x1, y1, x2, y2, c = 'ink', w = 3.5, both = false) =>
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C[c] || c}" stroke-width="${w}" stroke-linecap="round" marker-end="url(#ah-${c})" ${both ? `marker-start="url(#ah-${c})"` : ''}/>`;
const AP = (d, c = 'ink', w = 3.5) => `<path d="${d}" fill="none" stroke="${C[c]}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-${c})"/>`;
// Leader from a label to a part: line with a dot on the part.
const Lead = (x1, y1, x2, y2, c = C.line) => Ln(x1, y1, x2, y2, c, 2) + Ci(x2, y2, 5, c);
// Numbered badge.
const B = (x, y, n, col = C.cyan, r = 20) => Ci(x, y, r, col, '#fff', 3, 'filter="url(#sh)"') +
  `<text x="${x}" y="${y + r * 0.36}" font-size="${r * 1.05}" font-weight="800" fill="#fff" text-anchor="middle" font-family="${FONT}">${n}</text>`;
// Tick / cross marks.
const OK = (x, y, r = 22) => Ci(x, y, r, C.green) + P(`M${x - r * .45},${y} L${x - r * .1},${y + r * .38} L${x + r * .5},${y - r * .38}`, 'none', '#fff', r * .22);
const NO = (x, y, r = 22) => Ci(x, y, r, C.red) + Ln(x - r * .4, y - r * .4, x + r * .4, y + r * .4, '#fff', r * .22) + Ln(x + r * .4, y - r * .4, x - r * .4, y + r * .4, '#fff', r * .22);
// Dimension line with end ticks and a label.
function Dim(x1, y1, x2, y2, t, o = {}) {
  const c = o.c || C.cyan, horiz = Math.abs(y2 - y1) < Math.abs(x2 - x1);
  let s = Ln(x1, y1, x2, y2, c, 2.2, `marker-start="url(#ah-cyan)" marker-end="url(#ah-cyan)"`);
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  s += horiz ? T(mx, my - 10, t, { s: o.s || 20, c, a: 'middle', w: 700, bg: '#fff' })
             : T(mx + 12, my + 7, t, { s: o.s || 20, c, w: 700, bg: '#fff' });
  return s;
}

// --- parts ----------------------------------------------------------------
// NEMA17 seen from the side, shaft pointing UP. top = y of the motor face.
function motorUp(cx, top, k, o = {}) {
  const w = 42 * k, h = 40 * k, x = cx - w / 2;
  let s = `<g ${o.shadow === false ? '' : 'filter="url(#sh)"'}>`;
  s += R(x, top, w, h, 'url(#gMot)', C.motorD, 2, 3);
  s += R(x, top, w, h * 0.13, C.cap, C.capS, 1.5, 2);
  for (let i = 0; i < 8; i++) s += Ln(x + 4, top + h * (0.28 + i * 0.065), x + w - 4, top + h * (0.28 + i * 0.065), '#454C55', 1.6);
  s += R(x, top + h * 0.86, w, h * 0.14, '#2A2F36', C.motorD, 1.5, 2);
  if (o.conn !== false) s += R(x + w - 1, top + h * 0.66, 9, h * 0.18, '#F5F5F4', '#A8A29E', 1.5, 2);
  s += R(cx - 11 * k, top - 2 * k, 22 * k, 2 * k, '#CDD2D8', C.capS, 1.2, 1);
  const L = (o.shaft ?? 24) * k;
  s += R(cx - 2.5 * k, top - 2 * k - L, 5 * k, L, 'url(#gShV)', C.shaftS, 1.4, 1.5);
  s += '</g>';
  return s;
}
// NEMA17 lying down, shaft pointing RIGHT. right = x of the motor face.
function motorRight(right, cy, k, o = {}) {
  const w = 40 * k, h = 42 * k, x = right - w, y = cy - h / 2;
  let s = `<g filter="url(#sh)">`;
  s += R(x, y, w, h, 'url(#gMotH)', C.motorD, 2, 3);
  s += R(right - w * 0.13, y, w * 0.13, h, C.cap, C.capS, 1.5, 2);
  for (let i = 0; i < 8; i++) s += Ln(x + w * (0.2 + i * 0.07), y + 4, x + w * (0.2 + i * 0.07), y + h - 4, '#454C55', 1.6);
  s += R(x, y, w * 0.14, h, '#2A2F36', C.motorD, 1.5, 2);
  if (o.conn !== false) s += R(x + w * 0.3, y + h - 1, w * 0.2, 9, '#F5F5F4', '#A8A29E', 1.5, 2);
  s += R(right, cy - 11 * k, 2 * k, 22 * k, '#CDD2D8', C.capS, 1.2, 1);
  const L = (o.shaft ?? 24) * k;
  s += R(right + 2 * k, cy - 2.5 * k, L, 5 * k, 'url(#gShH)', C.shaftS, 1.4, 1.5);
  s += '</g>';
  return s;
}
// Clear acrylic piece seen edge-on or face-on.
const acr = (x, y, w, h, rx = 3) => `<g>${R(x, y, w, h, 'url(#gAcr)', C.acrS, 2.2, rx)}${Ln(x + 4, y + 3, x + w - 4, y + 3, '#fff', 2)}</g>`;
// Screw standing up: head at yHead, length len (px). Head on top.
function screwV(x, yHead, len, k, o = {}) {
  const hw = 5.5 * k, hh = 2.6 * k, sw = 3 * k;
  let s = R(x - sw / 2, yHead + hh, sw, len, 'url(#thr)', C.screwS, 1.2, 1);
  s += R(x - hw / 2, yHead, hw, hh, C.screw, C.screwS, 1.5, 2) + Ln(x - hw * 0.25, yHead + hh / 2, x + hw * 0.25, yHead + hh / 2, C.screwS, 1.5);
  return s;
}
// Screw pointing up with head at the BOTTOM (inserted from below).
function screwUp(x, yHeadBottom, len, k) {
  const hw = 5.5 * k, hh = 2.6 * k, sw = 3 * k;
  return R(x - sw / 2, yHeadBottom - hh - len, sw, len, 'url(#thr)', C.screwS, 1.2, 1) +
         R(x - hw / 2, yHeadBottom - hh, hw, hh, C.screw, C.screwS, 1.5, 2);
}
const nut = (x, y, k) => R(x - 3.2 * k, y, 6.4 * k, 2.4 * k, C.nut, C.screwS, 1.4, 1.2) + Ln(x - 1.6 * k, y + 1.2 * k, x + 1.6 * k, y + 1.2 * k, '#5B636E', 1.2);
// Diametric magnet side view: north half red, south half blue (poles across the diameter).
const magnetSide = (cx, y, w, h) => R(cx - w / 2, y, w / 2, h, C.mag, '#7F1D1D', 1.5, 1) + R(cx, y, w / 2, h, C.magB, '#1E3A8A', 1.5, 1);
const magnetTop = (cx, cy, r) => `<path d="M${cx},${cy - r} A${r},${r} 0 0 0 ${cx},${cy + r} Z" fill="${C.mag}" stroke="#7F1D1D" stroke-width="1.5"/>` +
  `<path d="M${cx},${cy - r} A${r},${r} 0 0 1 ${cx},${cy + r} Z" fill="${C.magB}" stroke="#1E3A8A" stroke-width="1.5"/>` +
  T(cx - r * 0.5, cy + r * 0.3, 'N', { s: r * 0.8, c: '#fff', a: 'middle', w: 800 }) + T(cx + r * 0.5, cy + r * 0.3, 'S', { s: r * 0.8, c: '#fff', a: 'middle', w: 800 });
// AS5600 board side view (chip below).
const sensorSide = (cx, y, w, h, chipDown = true) =>
  R(cx - w / 2, y, w, h, C.sens, C.sensD, 1.5, 2) + (chipDown ? R(cx - w * 0.14, y + h, w * 0.28, h * 0.7, C.chip, '#000', 1, 1) : R(cx - w * 0.14, y - h * 0.7, w * 0.28, h * 0.7, C.chip, '#000', 1, 1));
const putty = (x, y, w, h) => R(x, y, w, h, 'url(#gPutty)', C.puttyS, 2, Math.min(w, h) * 0.45) +
  Ci(x + w * 0.3, y + h * 0.4, 2, C.puttyHi) + Ci(x + w * 0.7, y + h * 0.6, 1.6, C.puttyHi);
const wood = (x, y, w, h) => R(x, y, w, h, 'url(#gWood)', C.woodS, 2, 4) + Ln(x + w * 0.3, y + 8, x + w * 0.3, y + h - 8, '#B98E5C', 1.4) + Ln(x + w * 0.65, y + 14, x + w * 0.65, y + h - 14, '#B98E5C', 1.4);
// Small green driver board (top view).
function driverTop(x, y, w, h) {
  let s = R(x, y, w, h, C.board, '#0F3D24', 2, 6, 'filter="url(#sh)"') + R(x + w * 0.33, y + h * 0.38, w * 0.34, h * 0.28, '#111', '#000', 1, 3);
  s += Ci(x + w * 0.5, y + h * 0.18, h * 0.07, '#D4D4D8', '#71717A', 1.5);
  return s;
}
// Blue Arduino Nano (top view).
function nanoTop(x, y, w, h, label = 'Arduino Nano') {
  let s = R(x, y, w, h, C.boardB, '#0B2E5C', 2, 6, 'filter="url(#sh)"');
  s += R(x - 14, y + h * 0.3, 18, h * 0.4, '#C7CCD3', '#6B7280', 1.5, 2);
  s += R(x + w * 0.4, y + h * 0.33, w * 0.2, h * 0.34, '#111', '#000', 1, 3);
  s += T(x + w * 0.5, y + h * 0.2, label, { s: 17, c: '#fff', a: 'middle', w: 700 });
  return s;
}
// Red LED side view: dome + legs (long + short).
function ledSide(cx, top, k = 1, col = C.red) {
  return P(`M${cx - 10 * k},${top + 24 * k} L${cx - 10 * k},${top + 10 * k} A${10 * k},${10 * k} 0 0 1 ${cx + 10 * k},${top + 10 * k} L${cx + 10 * k},${top + 24 * k} Z`, col, '#7F1D1D', 1.6) +
    R(cx - 12 * k, top + 24 * k, 24 * k, 4 * k, col, '#7F1D1D', 1.4, 1) +
    Ln(cx - 4 * k, top + 28 * k, cx - 4 * k, top + 70 * k, '#9CA3AF', 2.4) + Ln(cx + 4 * k, top + 28 * k, cx + 4 * k, top + 56 * k, '#9CA3AF', 2.4);
}
// Resistor (horizontal) with colour bands.
function resistor(x, y, w, bands) {
  let s = Ln(x - 22, y, x, y, '#9CA3AF', 2.6) + Ln(x + w, y, x + w + 22, y, '#9CA3AF', 2.6);
  s += R(x, y - 11, w, 22, '#E7CFA3', '#9C7A52', 1.6, 10);
  bands.forEach((b, i) => { s += R(x + w * (0.2 + i * 0.16), y - 11, w * 0.08, 22, b, 'none'); });
  return s;
}
// Credit card (gap gauge), side view.
const cards2 = (x, y, w) => R(x, y, w, 6, '#F59E0B', '#B45309', 1.2, 1.5) + R(x, y + 7, w, 6, '#3B82F6', '#1D4ED8', 1.2, 1.5);

/* ======================================================================
   Card builder
   ====================================================================== */
const PARTS = [
  ['PART 1 · THE SPINNING BASE', ''],
  ['PART 2 · THE TOP AND THE HEAD', 'p2'],
  ['PART 3 · WIRES AND CODE', 'p3'],
  ['PART 4 · TARGETS AND GO LIVE', 'p4'],
];
const CARDS = [];
function card(o) { CARDS.push(o); }
function render() {
  const total = CARDS.length;
  document.getElementById('cards').innerHTML = CARDS.map((c, i) => {
    const [kick, cls] = PARTS[c.part];
    return `<section class="card" id="card-${i}">
      <header><div class="num ${cls}">${c.n}</div><div><div class="kicker ${cls}">${kick}</div><h2>${c.title}</h2></div></header>
      <div class="art">${svg(c.art)}</div>
      <ol class="do">${c.steps.map(s => `<li>${s}</li>`).join('')}</ol>
      <div class="check ${c.warn ? 'warn' : ''}">${c.check}</div>
      <footer><span>ZeroDrift MK2 · build it with what you have</span><span>${i + 1} / ${total}</span></footer>
    </section>`;
  }).join('');
}

/* ----------------------------------------------------------------------
   0 · What you are building
   ---------------------------------------------------------------------- */
{
  const k = 3.4;
  let s = '';
  // table
  s += R(0, 640, 1004, 56, '#E2E8F0') + Ln(0, 640, 1004, 640, '#94A3B8', 2);
  // legs
  s += wood(262, 430, 40, 210) + wood(706, 430, 40, 210);
  // pan motor under base, spacer nuts
  s += motorUp(504, 447, k);
  s += nut(438, 430, k) + nut(570, 430, k);
  // base plate
  s += acr(249, 420, 510, 10);
  s += screwV(438, 411, 30, k * 0.9) + screwV(570, 411, 30, k * 0.9);
  // pan disc + putty
  s += putty(484, 377, 40, 26);
  s += acr(351, 365, 306, 10);
  // magnet on shaft tip
  s += magnetSide(504, 349, 22, 9);
  // pan sensor arm + post
  s += screwV(690, 300, 138, k * 0.8);
  s += nut(690, 410, k * 0.9) + nut(690, 432, k * 0.9);
  s += nut(690, 314, k * 0.9) + nut(690, 336, k * 0.9);
  s += acr(478, 324, 230, 10);
  s += sensorSide(504, 334, 54, 7);
  // stilts
  s += screwUp(372, 385, 84, k * 0.8) + nut(372, 356, k * 0.9) + nut(372, 305, k * 0.9);
  s += screwUp(452, 385, 84, k * 0.8) + nut(452, 356, k * 0.9) + nut(452, 305, k * 0.9);

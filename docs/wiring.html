<style>
:root{
  --bg:#060b14; --panel:#0a1220; --panel-2:#0d1624; --edge:#16233a;
  --ink:#c9d6e6; --ink-dim:#5f7288; --ink-bright:#EAF4FD;
  --cyan:#4FC7EA; --green:#3BD68C; --amber:#FFC24D; --red:#FF5555;
  --mono:"SF Mono","Cascadia Code",Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.5 var(--mono);overflow:hidden}
a{color:var(--cyan);text-decoration:none}
header{display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:1px solid var(--edge);height:44px}
header .wm{font-size:15px;font-weight:700;color:var(--ink-bright)} header .wm b{color:var(--cyan)}
.tabs{display:flex}
.tabs a{display:block;padding:6px 14px;font-size:11px;letter-spacing:.4px;color:var(--ink);background:var(--panel-2);
  border:1px solid var(--edge);border-left-width:0}
.tabs a:first-child{border-radius:4px 0 0 4px;border-left-width:1px} .tabs a:last-child{border-radius:0 4px 4px 0}
.tabs a:hover{color:var(--cyan)} .tabs a.on{background:#12243c;border-color:var(--cyan);color:var(--cyan)}
header nav{margin-left:auto;font-size:11px} header nav a{margin-left:13px;color:var(--ink-dim)}
.wrap{display:grid;grid-template-columns:1fr 360px;height:calc(100% - 44px)}
.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.hud{padding:12px 16px 4px}
.hud .n{font-size:10px;color:var(--ink-dim);letter-spacing:.8px}
.hud .now{font-size:17px;color:var(--cyan);font-weight:700;margin:2px 0 4px}
.hud .why{font-size:12px;line-height:1.55;max-width:900px}
.hud .dims{display:inline-block;margin-top:6px;padding:4px 9px;border:1px solid var(--amber);color:var(--amber);font-size:11px;max-width:900px}
.hud .warn{border-color:var(--red);color:#ffb3b3}
svg#w{flex:1;width:100%;min-height:0;display:block}
.bar{display:flex;gap:8px;align-items:center;padding:8px 16px 12px}
button{background:#0d1a2c;color:var(--ink);border:1px solid var(--edge);border-radius:4px;padding:8px 14px;font:700 12px var(--mono);cursor:pointer}
button:hover{border-color:var(--cyan);color:var(--cyan)} button.on{border-color:var(--cyan);color:var(--cyan);background:#12243c}
.prog{flex:1;height:3px;background:var(--edge);border-radius:2px;overflow:hidden} .prog i{display:block;height:100%;background:var(--cyan);width:0;transition:width .3s}
aside{border-left:1px solid var(--edge);background:var(--panel);overflow-y:auto;padding:12px}
aside h3{font-size:11px;color:var(--ink-dim);letter-spacing:.8px;margin:4px 0 10px}
.step{display:flex;gap:10px;padding:7px 8px;border:1px solid transparent;border-radius:4px;cursor:pointer;margin-bottom:3px}
.step:hover{border-color:var(--edge)} .step.on{border-color:var(--cyan);background:#0d1a2c}
.step .k{flex:none;width:24px;height:24px;border-radius:50%;background:#12243c;color:var(--cyan);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}
.step.done .k{background:var(--cyan);color:#06101c}
.step .t{font-size:12px;font-weight:700;color:var(--ink-bright)} .step .d{font-size:10.5px;color:var(--ink-dim);margin-top:1px}
.legend{margin-top:12px;border-top:1px solid var(--edge);padding-top:10px;font-size:11px;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
@media (max-width:860px){.wrap{grid-template-columns:1fr;grid-template-rows:64% 36%}aside{border-left:0;border-top:1px solid var(--edge)}}
</style>

<header>

  <div class="tabs">

<div class="wrap">
  <div class="stage">
    <div class="hud"><div class="n" id="hn"></div><div class="now" id="ht"></div><div class="why" id="hw"></div><div class="dims" id="hd"></div></div>

      <div class="prog"><i id="pg"></i></div>

    </div>

    <div id="steps"></div>
    <div class="legend">
      <span><i style="background:#ff5555"></i>+12 V</span><span><i style="background:#ffb020"></i>5 V</span>
      <span><i style="background:#9aa8bb"></i>GND</span><span><i style="background:#cbd5e1"></i>USB</span>
      <span><i style="background:#b69cff"></i>STEP</span><span><i style="background:#ff6fb5"></i>DIR</span>
      <span><i style="background:#4f9dff"></i>SDA</span><span><i style="background:#3bd68c"></i>SCL</span>
      <span><i style="background:#2dd4bf"></i>laser signal</span><span><i style="background:#f97316"></i>motor coils</span>
    </div>

<script>
/* Pins match tools/rig/rig_firmware_v2.ino: pan STEP/DIR = D2/D3, tilt STEP/DIR = D4/D5,
   laser = D7, TCA9548A on A4 (SDA) / A5 (SCL), pan AS5600 on multiplexer channel 0.
   Drawing is in a 1200 x 760 box. Each wire belongs to the step that adds it. */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('w');
const K = {v12:'#ff5555', v5:'#ffb020', gnd:'#9aa8bb', usb:'#cbd5e1', step:'#b69cff', dir:'#ff6fb5', sda:'#4f9dff', scl:'#3bd68c', las:'#2dd4bf',
  cg:'#3bd68c', ck:'#8b95a5', cr:'#ff5555', cb:'#4f9dff', ink:'#EAF4FD', dim:'#5f7288', board:'#0f2a1c', nano:'#12305e', mux:'#15283f', sens:'#3b1d78'};
const el = (tag, a, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; };
const txt = (x, y, t, o = {}, parent = svg) => { const e = el('text', {x, y, fill:o.c || K.ink, 'font-size':o.s || 12, 'font-weight':o.w || 700, 'text-anchor':o.a || 'start', 'font-family':'DejaVu Sans Mono, monospace'}, parent); e.textContent = t; return e; };
const pin = (x, y, parent = svg) => el('circle', {cx:x, cy:y, r:3.6, fill:'#facc15', stroke:'#a16207', 'stroke-width':1}, parent);

/* ---------- static parts ---------- */
const base = el('g', {});
// rails
[[90, K.v12, '+12 V rail'], [112, K.v5, '5 V rail'], [134, K.gnd, 'GND rail']].forEach(([y, c, t]) => {
  el('line', {x1:150, y1:y, x2:1185, y2:y, stroke:c, 'stroke-width':5, 'stroke-linecap':'round', opacity:.9}, base);
  txt(1120, y - 6, t, {c, s:11, a:'end'}, base);
});
txt(155, 158, 'breadboard rails', {c:K.dim, s:10, w:600}, base);
// 12 V adapter, DC socket, switch
el('rect', {x:18, y:34, width:62, height:44, rx:7, fill:'#111827', stroke:'#334155'}, base); txt(49, 61, '12 V', {a:'middle', s:13}, base); txt(49, 26, 'adapter', {a:'middle', s:10, c:K.dim}, base);
el('rect', {x:96, y:44, width:30, height:26, rx:4, fill:'#1f2937', stroke:'#475569'}, base); el('circle', {cx:111, cy:57, r:6, fill:'#0b1220', stroke:'#64748b'}, base); txt(111, 38, 'socket', {a:'middle', s:9, c:K.dim}, base);
el('line', {x1:80, y1:56, x2:96, y2:56, stroke:'#475569', 'stroke-width':4}, base);
// Nano
el('rect', {x:230, y:240, width:100, height:360, rx:8, fill:K.nano, stroke:'#3b82f6', 'stroke-width':1.5}, base);
el('rect', {x:268, y:598, width:24, height:14, rx:2, fill:'#9ca3af'}, base);
txt(280, 418, 'ARDUINO', {a:'middle', s:12}, base); txt(280, 434, 'NANO', {a:'middle', s:12}, base); txt(280, 450, '(rig)', {a:'middle', s:10, c:K.dim}, base);
const NL = {v5:[230, 280], gnd:[230, 310], a4:[230, 500], a5:[230, 530]};
const NR = {d2:[330, 290], d3:[330, 320], d4:[330, 440], d5:[330, 470], d7:[330, 560]};
[['5V', NL.v5], ['GND', NL.gnd], ['A4', NL.a4], ['A5', NL.a5]].forEach(([t, [x, y]]) => { pin(x, y, base); txt(x + 8, y + 4, t, {s:11}, base); });
[['D2', NR.d2], ['D3', NR.d3], ['D4', NR.d4], ['D5', NR.d5], ['D7', NR.d7]].forEach(([t, [x, y]]) => { pin(x, y, base); txt(x - 8, y + 4, t, {s:11, a:'end'}, base); });
// laptop
el('rect', {x:212, y:664, width:106, height:66, rx:6, fill:'#0b1220', stroke:'#475569'}, base); el('rect', {x:200, y:730, width:130, height:8, rx:3, fill:'#334155'}, base);
txt(265, 702, 'laptop', {a:'middle', s:12, c:K.dim}, base);
// drivers
function driver(y0, name) {
  el('rect', {x:520, y:y0, width:140, height:212, rx:8, fill:K.board, stroke:'#22c55e', 'stroke-width':1.3}, base);
  txt(590, y0 - 8, name, {a:'middle', s:12, c:'#86efac'}, base);
  el('rect', {x:565, y:y0 + 92, width:50, height:40, rx:4, fill:'#0a0a0a'}, base); txt(590, y0 + 116, 'A4988', {a:'middle', s:9, c:K.dim}, base);
  el('circle', {cx:590, cy:y0 + 62, r:9, fill:'#d4d4d8', stroke:'#71717a'}, base); el('line', {x1:584, y1:y0 + 62, x2:596, y2:y0 + 62, stroke:'#52525b', 'stroke-width':2.5}, base);
  const L = ['EN', 'MS1', 'MS2', 'MS3', 'RST', 'SLP', 'STEP', 'DIR'], R = ['VMOT', 'GND', '2B', '2A', '1A', '1B', 'VDD', 'GND'];
  const p = {};
  L.forEach((t, i) => { const y = y0 + 20 + i * 24; pin(520, y, base); txt(528, y + 4, t, {s:10}, base); p['L' + t] = [520, y]; });
  R.forEach((t, i) => { const y = y0 + 20 + i * 24; pin(660, y, base); txt(652, y + 4, t, {s:10, a:'end'}, base); p['R' + i] = [660, y]; });
  return p;
}
const PD = driver(190, 'PAN DRIVER (bottom motor)');
const TD = driver(430, 'TILT DRIVER (top motor)');
// motors
function motor(y0, name) {
  el('rect', {x:830, y:y0, width:130, height:110, rx:10, fill:'#1d2127', stroke:'#475569', 'stroke-width':1.5}, base);
  el('circle', {cx:895, cy:y0 + 55, r:16, fill:'#b9c1cb'}, base); el('circle', {cx:895, cy:y0 + 55, r:5, fill:'#6b7280'}, base);
  txt(895, y0 + 128, name, {a:'middle', s:11, c:K.dim}, base);
}
motor(230, 'PAN motor (bottom)'); motor(490, 'TILT motor (top)');
// multiplexer + sensor
el('rect', {x:30, y:470, width:140, height:100, rx:8, fill:K.mux, stroke:'#3b82f6', 'stroke-width':1.2}, base);
txt(100, 462, 'MULTIPLEXER TCA9548A', {a:'middle', s:10, c:'#93c5fd'}, base);
[['SDA', 500], ['SCL', 530]].forEach(([t, y]) => { pin(170, y, base); txt(162, y + 4, t, {s:10, a:'end'}, base); });
[['VIN', 492], ['GND', 512], ['A0-2', 532]].forEach(([t, y]) => { pin(30, y, base); txt(38, y + 4, t, {s:10}, base); });
[['SD0', 80], ['SC0', 120]].forEach(([t, x]) => { pin(x, 570, base); txt(x, 562, t, {s:9, a:'middle'}, base); });
el('rect', {x:30, y:640, width:140, height:80, rx:8, fill:K.sens, stroke:'#8b5cf6', 'stroke-width':1.2}, base);
txt(100, 736, 'AS5600 (pan sensor)', {a:'middle', s:10, c:'#c4b5fd'}, base);
el('rect', {x:88, y:668, width:24, height:24, fill:'#0a0a0a'}, base);
[['SDA', 80], ['SCL', 120]].forEach(([t, x]) => { pin(x, 640, base); txt(x, 656, t, {s:9, a:'middle'}, base); });
[['VCC', 652], ['GND', 674], ['DIR', 696]].forEach(([t, y]) => { pin(170, y, base); txt(162, y + 4, t, {s:9, a:'end'}, base); });
// laser
el('rect', {x:362, y:650, width:74, height:64, rx:6, fill:'#171717', stroke:'#525252'}, base);
el('rect', {x:392, y:714, width:14, height:22, rx:3, fill:'#c9a227'}, base); el('circle', {cx:399, cy:738, r:3, fill:'#ff3030'}, base);
txt(399, 644, 'LASER KY-008', {a:'middle', s:9, c:K.dim}, base);
[['S', 666], ['mid', 684], ['−', 702]].forEach(([t, y]) => { pin(362, y, base); txt(370, y + 4, t, {s:9}, base); });

/* ---------- wires, by step ---------- */
const W = []; const N = [];
const w = (step, d, c, sw = 3) => W.push({step, d, c, sw});
const net = (step, x, y, t, c, anchor = 'end') => N.push({step, x, y, t, c, anchor});   // net label: "this pin goes to that rail"

// 1: USB to the laptop
w(1, 'M280,612 L280,664', K.usb, 5);
// 2: Nano 5V + GND to the rails
w(2, 'M230,280 L205,280 L205,112', K.v5); w(2, 'M230,310 L188,310 L188,134', K.gnd);
// 3: driver jumpers (both drivers): EN->GND, MS1-3 -> 5V, RST<->SLP
for (const P of [PD, TD]) {
  net(3, 512, P.LEN[1] + 4, 'GND', K.gnd);
  w(3, `M520,${P.LMS1[1]} L506,${P.LMS1[1]} L506,${P.LMS3[1]} L520,${P.LMS3[1]} M506,${P.LMS2[1]} L520,${P.LMS2[1]}`, K.v5, 2.5);
  net(3, 500, P.LMS2[1] + 4, '5V', K.v5);
  w(3, `M520,${P.LRST[1]} C498,${P.LRST[1]} 498,${P.LSLP[1]} 520,${P.LSLP[1]}`, K.step, 2.5);
}
// 4: driver logic power VDD->5V, GND->GND
for (const P of [PD, TD]) { net(4, 668, P.R6[1] + 4, '5V', K.v5, 'start'); net(4, 668, P.R7[1] + 4, 'GND', K.gnd, 'start'); }
// 5: STEP/DIR
w(5, `M330,290 L450,290 L450,${PD.LSTEP[1]} L520,${PD.LSTEP[1]}`, K.step); w(5, `M330,320 L430,320 L430,${PD.LDIR[1]} L520,${PD.LDIR[1]}`, K.dir);
w(5, `M330,440 L460,440 L460,${TD.LSTEP[1]} L520,${TD.LSTEP[1]}`, K.step); w(5, `M330,470 L440,470 L440,${TD.LDIR[1]} L520,${TD.LDIR[1]}`, K.dir);
// 6: motor coils (2B 2A = one pair, 1A 1B = the other)
for (const [P, my] of [[PD, 230], [TD, 490]]) {
  [[2, K.cg], [3, K.ck], [4, K.cr], [5, K.cb]].forEach(([i, c], j) => { const y = P['R' + i][1]; w(6, `M660,${y} L${760 + j * 6},${y} L${760 + j * 6},${my + 25 + j * 20} L830,${my + 25 + j * 20}`, c, 3); });
}
// 7: 12 V in: adapter -> socket -> switch -> +12 V rail; socket - -> GND rail
w(7, 'M126,52 L146,52 L162,40 M166,52 L180,52 L180,90', K.v12, 3.5); w(7, 'M111,70 L111,134 L150,134', K.gnd, 3.5);
N.push({step:7, x:154, y:36, t:'switch', c:K.dim, anchor:'middle'});
// 8: VMOT + GND to the rails, with the 100 uF capacitor
w(8, `M660,${PD.R0[1]} L690,${PD.R0[1]} L690,90`, K.v12); w(8, `M660,${PD.R1[1]} L705,${PD.R1[1]} L705,134`, K.gnd);
w(8, `M660,${TD.R0[1]} L1150,${TD.R0[1]} L1150,90`, K.v12); w(8, `M660,${TD.R1[1]} L1165,${TD.R1[1]} L1165,134`, K.gnd);
// 10: sensor through the multiplexer
w(10, 'M230,500 L170,500', K.sda); w(10, 'M230,530 L170,530', K.scl);
w(10, 'M80,570 L80,640', K.sda); w(10, 'M120,570 L120,640', K.scl);
net(10, 22, 496, '5V', K.v5); net(10, 22, 516, 'GND', K.gnd); net(10, 22, 536, 'GND', K.gnd);
net(10, 178, 656, '5V', K.v5, 'start'); net(10, 178, 678, 'GND', K.gnd, 'start'); net(10, 178, 700, 'GND', K.gnd, 'start');
// 11: laser
w(11, 'M330,560 L348,560 L348,666 L362,666', K.las); net(11, 356, 706, 'GND', K.gnd); net(11, 356, 688, '×', K.dim);

const CAPS = [[697, 170, 8], [1157, 300, 8]];   // capacitor symbols between the VMOT/GND pairs

const STEPS = [
  {t:'Lay out the parts', d:'nothing connected yet', why:'Put everything on the table like this: breadboard rails at the top, the Nano on the left, the two drivers in the middle, the motors on the right, multiplexer + sensor bottom-left, laser beside the Nano. Keep the 12 V adapter UNPLUGGED for the whole job until step 12.', dims:'no power anywhere yet'},
  {t:'USB: Nano to the laptop', d:'powers the Nano only', why:'The laptop USB powers the Nano and carries the commands. Upload rig_firmware_v2.ino now, before anything else is connected, so you know the Nano works.', dims:'Nano USB → laptop'},
  {t:'Nano 5V and GND to the rails', d:'one shared ground', why:'Nano 5V goes to the 5 V rail, Nano GND to the GND rail. Every other GND in the rig joins this same rail: that shared ground is what lets the signals mean anything.', dims:'Nano 5V → 5 V rail · Nano GND → GND rail'},
  {t:'Driver jumpers (both drivers)', d:'EN, MS1-3, RST-SLP', why:'On BOTH drivers: EN to GND (motors enabled), MS1 MS2 MS3 all to 5 V (1/16 microstepping, what the firmware expects), and a short jumper joining RST to SLP (keeps the driver awake).', dims:'EN → GND · MS1+MS2+MS3 → 5 V · RST ↔ SLP'},
  {t:'Driver logic power', d:'VDD and the lower GND', why:'The two pins at the bottom-right of each driver are its logic power: VDD to the 5 V rail, the GND next to it to the GND rail.', dims:'VDD → 5 V rail · GND (bottom) → GND rail · both drivers'},
  {t:'STEP and DIR from the Nano', d:'D2 D3 pan · D4 D5 tilt', why:'These four wires are how the Nano moves the motors. D2 → pan STEP, D3 → pan DIR, D4 → tilt STEP, D5 → tilt DIR. The pan driver runs the bottom motor, the tilt driver runs the top one.', dims:'D2→STEP  D3→DIR (pan) · D4→STEP  D5→DIR (tilt)'},
  {t:'Motor coils', d:'find the pairs first', why:'Each motor has 4 wires = 2 coils. Multimeter on Ω: the 2 wires that read 1 to 4 Ω are one pair. One pair goes to 2B/2A, the other to 1A/1B. Usually black+green and red+blue, but CHECK. Never pull a motor wire while 12 V is on.', dims:'pair 1 → 1A 1B · pair 2 → 2A 2B · both motors'},
  {t:'12 V supply into the rail', d:'switch OFF, adapter unplugged', why:'Adapter → DC socket → switch → +12 V rail. Socket − goes to the GND rail. Find which socket pin is + with the multimeter first. Leave the switch OFF.', dims:'socket + → switch → +12 V rail · socket − → GND rail', warn:true},
  {t:'VMOT + capacitors', d:'12 V only ever goes here', why:'Each driver\'s VMOT to the +12 V rail, the GND beside it to the GND rail, and a 100 µF capacitor across those two pins right at the driver (long leg to VMOT, striped leg to GND). The capacitor stops the power-on spike killing the driver.', dims:'VMOT → +12 V · GND → GND · 100 µF across, stripe to GND', warn:true},
  {t:'Set Vref (no new wires)', d:'USB only, 12 V still OFF', why:'With only the USB plugged in: black probe on GND, red probe on the little screw on each driver. Turn it gently until it reads 0.55 V. Do both drivers.', dims:'Vref = 0.55 V on both drivers (R100 boards)'},
  {t:'Sensor through the multiplexer', d:'A4 A5 → mux → channel 0', why:'Nano A4 → mux SDA, A5 → mux SCL. Mux VIN → 5 V, GND → GND, A0 A1 A2 → GND. The pan AS5600 plugs into channel 0 (SD0/SC0), with its VCC → 5 V, GND → GND, DIR → GND. The tilt sensor is skipped: the head box covers the tilt shaft end.', dims:'A4→SDA · A5→SCL · sensor on SD0/SC0 · DIR→GND'},
  {t:'Laser', d:'S → D7, − → GND', why:'Laser board: S to D7, − to the GND rail, the middle pin to nothing. The firmware turns D7 on and off.', dims:'S → D7 · − → GND · middle → nothing'},
  {t:'Power on and test', d:'everything connected', why:'Check the rails with the multimeter: +12 V rail ≈ 12 V, 5 V rail ≈ 5 V, and 12 V touches ONLY the two VMOT pins. Then plug in the adapter and switch ON: both shafts go stiff. Open the Serial Monitor (115200), type ? and look for encoders=pan, then P267 T0 to move.', dims:'switch ON → shafts stiff · ? → encoders=pan · P267 T0 → pan turns', all:true},
];

const layer = el('g', {});
let cur = 0, showAll = false, playing = false, timer = null;
function render() {
  layer.remove(); const g = el('g', {});
  const lim = (showAll || STEPS[cur].all) ? 99 : cur;
  // capacitors appear with step 8
  if (lim >= 8) CAPS.forEach(([x, y]) => { el('rect', {x:x - 6, y:y - 9, width:20, height:18, rx:6, fill:'#2563eb', stroke:'#93c5fd', opacity:lim === 8 && !showAll ? 1 : .6}, g); });
  W.filter(o => o.step <= lim).forEach(o => {
    const now = o.step === cur && !showAll && !STEPS[cur].all;
    const p = el('path', {d:o.d, fill:'none', stroke:o.c, 'stroke-width':now ? o.sw + 1.2 : o.sw, 'stroke-linecap':'round', 'stroke-linejoin':'round', opacity:now || showAll || STEPS[cur].all ? 1 : .33}, g);
    if (now) { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.getBoundingClientRect(); p.style.transition = 'stroke-dashoffset 1.2s ease-out'; p.style.strokeDashoffset = 0;
      el('path', {d:o.d, fill:'none', stroke:o.c, 'stroke-width':o.sw + 8, opacity:.15, 'stroke-linecap':'round'}, g); }
  });
  N.filter(o => o.step <= lim).forEach(o => {
    const now = o.step === cur && !showAll && !STEPS[cur].all;
    const t = txt(o.x, o.y, o.t, {c:o.c, s:10, a:o.anchor}, g); t.setAttribute('opacity', now || showAll || STEPS[cur].all ? 1 : .4);
  });
  svg.appendChild(g); layer.remove = () => g.remove();
  const s = STEPS[cur];
  document.getElementById('hn').textContent = `STEP ${cur + 1} / ${STEPS.length}`;
  document.getElementById('ht').textContent = s.t;
  document.getElementById('hw').textContent = s.why;
  const hd = document.getElementById('hd'); hd.textContent = s.dims; hd.classList.toggle('warn', !!s.warn);
  document.getElementById('pg').style.width = ((cur + 1) / STEPS.length * 100) + '%';
  document.querySelectorAll('.step').forEach((e, k) => { e.classList.toggle('on', k === cur); e.classList.toggle('done', k < cur); });
}
const stepsEl = document.getElementById('steps');
STEPS.forEach((s, i) => { const e = document.createElement('div'); e.className = 'step'; e.innerHTML = `<div class="k">${i + 1}</div><div><div class="t">${s.t}</div><div class="d">${s.d}</div></div>`; e.onclick = () => { stop(); go(i); }; stepsEl.appendChild(e); });
function go(i) { cur = (i + STEPS.length) % STEPS.length; render(); }
function stop() { playing = false; clearInterval(timer); const b = document.getElementById('play'); b.textContent = '▶ play'; b.classList.remove('on'); }
document.getElementById('prev').onclick = () => { stop(); go(cur - 1); };
document.getElementById('next').onclick = () => { stop(); go(cur + 1); };
document.getElementById('play').onclick = () => { if (playing) return stop(); playing = true; const b = document.getElementById('play'); b.textContent = '❚❚ pause'; b.classList.add('on'); timer = setInterval(() => go(cur + 1), 4500); };
document.getElementById('all').onclick = e => { showAll = !showAll; e.target.classList.toggle('on', showAll); render(); };
addEventListener('keydown', e => { if (e.key === 'ArrowRight') { stop(); go(cur + 1); } if (e.key === 'ArrowLeft') { stop(); go(cur - 1); } if (e.key === ' ') { e.preventDefault(); document.getElementById('play').click(); } });
go(0);
window.__steps = STEPS.length;
</script>
